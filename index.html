<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Network Playground</title>
  <script type="module" crossorigin src="/neural-playground/assets/index-CQBBoBBE.js"></script>
  <link rel="stylesheet" crossorigin href="/neural-playground/assets/index-8GU3zP3B.css">
</head>
<body>
  <h1>Neural Network Playground</h1>

  <div class="topbar">
    <button id="runBtn">▶ Run</button>
    <button id="stepBtn">Step</button>
    <button id="resetBtn">↺ Reset</button>
    <span class="stat">Epoch: <b id="epochCount">000000</b></span>

    <label>Learning Rate
      <select id="lr">
        <option>0.00001</option><option>0.0001</option><option>0.001</option>
        <option>0.003</option><option>0.01</option><option selected>0.03</option>
        <option>0.1</option><option>0.3</option><option>1</option><option>3</option>
      </select>
    </label>
    <label>Activation
      <select id="activation">
        <option value="tanh" selected>Tanh</option>
        <option value="relu">ReLU</option>
        <option value="sigmoid">Sigmoid</option>
        <option value="linear">Linear</option>
      </select>
    </label>
    <label>Regularization
      <select id="reg">
        <option value="none" selected>None</option>
        <option value="l1">L1</option>
        <option value="l2">L2</option>
      </select>
    </label>
    <label>Reg Rate
      <select id="regRate">
        <option>0</option><option>0.001</option><option>0.003</option>
        <option>0.01</option><option>0.03</option><option>0.1</option>
        <option>0.3</option><option>1</option>
      </select>
    </label>
    <label>Problem
      <select id="problem">
        <option value="classification" selected>Classification</option>
        <option value="regression">Regression</option>
      </select>
    </label>
  </div>

  <div class="layout">
    <!-- LEFT: Data controls -->
    <div class="panel data-panel">
      <h3>Data</h3>
      <label>Dataset
        <select id="dataset">
          <option value="circle">Circle</option>
          <option value="xor">XOR</option>
          <option value="gaussian">Gaussian</option>
          <option value="spiral">Spiral</option>
        </select>
      </label>
      <label>Train/Test Ratio: <span id="ratioVal">50</span>%
        <input type="range" id="ratio" min="10" max="90" value="50" />
      </label>
      <label>Noise (coord units): <span id="noiseVal">1.0</span>
        <input type="range" id="noise" min="0" max="5" step="0.1" value="1" />
      </label>
      <label>Batch Size: <span id="batchVal">10</span>
        <input type="range" id="batch" min="1" max="30" value="10" />
      </label>
    </div>

    <!-- FEATURES -->
    <div class="panel feature-panel">
      <h3>Features</h3>
      <p class="hint">Which properties to feed in:</p>
      <div id="featureList"></div>
    </div>

    <!-- NETWORK -->
    <div class="panel network-panel">
      <h3>Network Architecture</h3>
      <div class="layer-controls">
        <span>Hidden Layers:</span>
        <button id="removeLayer">−</button>
        <b id="layerCount">2</b>
        <button id="addLayer">+</button>
      </div>
      <div class="network-stage">
        <div id="neuronControls" class="neuron-controls"></div>
        <svg id="netSvg" width="800" height="450"></svg>
      </div>
    </div>

    <!-- OUTPUT -->
    <div class="panel output-panel">
      <h3>Output</h3>
      <div class="loss-box">
        <canvas id="lossChart" width="220" height="120"></canvas>
        <div class="loss-labels">
          <div><span class="swatch" style="background:#3a5fcd"></span>Train loss: <b id="trainLoss">0.000</b></div>
          <div><span class="swatch" style="background:#e8743b"></span>Test loss: <b id="testLoss">0.000</b></div>
        </div>
      </div>
      <canvas id="heatmap" width="450" height="450"></canvas>
      <canvas id="colorScale" width="450" height="30"></canvas>
      <label class="checkbox">
        <input type="checkbox" id="showTest" /> Show test data
      </label>
    </div>
  </div>

</body>
</html>
